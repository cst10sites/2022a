<!DOCTYPE html>
<html lang = "en">
<head>
<meta charset="UTF-8">
<title>Game X</title>
<link rel="stylesheet" href="style-a4.css">
<link rel="icon" href="favicon.ico">
</head>
<body id = "body" style="background-color: White">
   
<div class = "topic">
<h1 id = "pp1">Simon Says</h1>
</div>

<p style="color: white" id = "S1">Made by Richard</p>

<h3 class = "p1" id = "pp2">Score: <span id="score">0</span></h3>
<p style="color: white" id = "S2">Made by Richard</p>

<h3 class = "p2" id = "pp3">Time Left: <span id="countdown">15</span></h3>
<p style="color: white" id = "S3">Made by Richard</p>

<h3 class = "p3" id = "pp4">Simon Says: <span id="SS">Hello</span></h3>
<p style="color: white" id = "S4">Made by Richard</p>

<h3 class = "p4" id = "pp5">Highest Score: <span id="HS">0</span></h3>
<p style="color: white" id = "S5">Made by Richard</p>

<div class = "four-buttons">
<button class = "button button1" onclick="blue();" id="bluebutton"></button>

<button class = "button button2" onclick="red();" id="redbutton"></button>

<button class = "button button3" onclick="green();" id="greenbutton"></button>

<button class = "button button4" onclick="yellow();" id="yellowbutton"></button>
</div>

<p style="color: white" id = "S6">Made by Richard</p>

<button class = "start" onclick="startGame();" id="starter">START</button>

<p style="color: white" id = "S7">Made by Richard</p>

<button class = "darkmode" onclick = "darkmode();" id = "darkmode">DARKMODE</button>
