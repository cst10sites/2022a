<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset="UTF-8">
    <title>Simon Says</title>
    <link rel = "stylesheet" href = "Styles.css">
</head>
<body>

<h1>Simon Says</h1> 

<button style="background-color: lightgray;" onclick="startGame()" id="start">Start</button>
<hr>
<p><span id="Simon"></span></p>
<p><span id="timeDisplayed"></span></p>
<p><span id="score"></span></p>
<button style="background-color: crimson;" onclick="red()">Red</button>
<button style="background-color: darkgreen;" onclick="green()">Green</button>
<button style="background-color: mediumblue;" onclick="blue()">Blue</button>
<button style="background-color: yellow;" onclick="yellow()">Yellow</button>

<script src="Scripts.js"></script>
</body>
</html>
